name: 更新籌碼資料v3

on:
  schedule:
    # 台灣時間週一至週五：14:32 起每 15 分鐘更新至 18:32
    - cron: '32,47 14 * * 1-5'
      timezone: 'Asia/Taipei'
    - cron: '2,17,32,47 15-17 * * 1-5'
      timezone: 'Asia/Taipei'
    - cron: '2,17,32 18 * * 1-5'
      timezone: 'Asia/Taipei'
    # 當日最後一次更新
    - cron: '10 21 * * 1-5'
      timezone: 'Asia/Taipei'

  workflow_dispatch:
    inputs:
      backfill:
        description: "回補幾個日曆日（留白＝不回補，只做一般更新）"
        required: false
        default: ""
      force:
        description: "強制重算已存在的資料（修正計算邏輯後用這個，會覆蓋舊資料）"
        required: false
        type: boolean
        default: false
      force_fields:
        description: "強制重算時只動哪些欄位，空白代表全部（例：twse_insti tpex_insti）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install --quiet requests

      - name: 回補歷史（僅手動觸發且有填天數時）
        if: inputs.backfill != ''
        run: |
          python scripts/backfill.py "${{ inputs.backfill }}" \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.force_fields }}

      - name: 抓取最新資料
        run: python scripts/update.py

      - name: 產出 dashboard.json
        run: python scripts/build.py

      - name: 提交變更
        run: |
          if git diff --quiet; then
            echo "沒有資料變動，略過提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git commit -m "資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git push
