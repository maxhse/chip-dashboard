<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>法人籌碼儀錶板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
  <div class="masthead-title">
    <h1>法人籌碼儀錶板</h1>
    <p class="tagline">上市櫃三大法人 · 融資餘額 · 台指期未平倉</p>
  </div>
  <div id="feeds" class="feeds" aria-label="各資料來源更新狀態"></div>
</header>

<main>

  <section class="band" id="band-today">
    <div class="band-head">
      <h2>今日盤後</h2>
      <span class="eyebrow" id="today-date">—</span>
    </div>
    <div id="summary" class="summary"></div>
  </section>

  <section class="band">
    <div class="band-head">
      <h2>近期趨勢</h2>
      <div class="switch" id="win-switch" role="group" aria-label="觀察區間">
        <button data-win="5">近 5 日</button>
        <button data-win="10" class="on">近 10 日</button>
        <button data-win="20">近 20 日</button>
      </div>
    </div>
    <div id="charts" class="charts"></div>
  </section>

  <section class="band">
    <div class="band-head">
      <h2>逐日明細</h2>
      <span class="eyebrow">買賣超單位：億元　融資餘額：億元　未平倉：口</span>
    </div>
    <div class="scroller">
      <table class="grid" id="detail">
        <thead>
          <tr>
            <th rowspan="2" class="c-date">日期</th>
            <th colspan="3" class="grp">上市買賣超</th>
            <th colspan="3" class="grp">上櫃買賣超</th>
            <th colspan="2" class="grp">融資餘額</th>
            <th rowspan="2">台指期<br>外資淨額</th>
          </tr>
          <tr>
            <th>外資</th><th>投信</th><th>自營</th>
            <th>外資</th><th>投信</th><th>自營</th>
            <th>上市</th><th>上櫃</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="band">
    <div class="band-head">
      <h2>個股買賣超排行</h2>
      <div class="switch-row">
        <div class="switch" id="who-switch" role="group" aria-label="法人">
          <button data-who="f" class="on">外資</button>
          <button data-who="t">投信</button>
        </div>
        <div class="switch" id="rank-switch" role="group" aria-label="累計天數">
          <button data-w="1" class="on">1 日</button>
          <button data-w="3">3 日</button>
          <button data-w="5">5 日</button>
          <button data-w="10">10 日</button>
          <button data-w="20">20 日</button>
        </div>
      </div>
    </div>
    <p class="note" id="rank-note"></p>
    <div class="ranks">
      <div class="rank-col">
        <h3 class="rank-head buy">買超</h3>
        <ol class="rank" id="rank-buy"></ol>
      </div>
      <div class="rank-col">
        <h3 class="rank-head sell">賣超</h3>
        <ol class="rank" id="rank-sell"></ol>
      </div>
    </div>
  </section>

</main>

<footer>
  <p>資料來源：臺灣證券交易所、證券櫃檯買賣中心、臺灣期貨交易所。個股買賣超金額由官方公布之買賣超股數乘上當日成交均價估算，與券商系統會有些微差異。</p>
  <p id="built">—</p>
</footer>

<script src="app.js"></script>
</body>
</html>
