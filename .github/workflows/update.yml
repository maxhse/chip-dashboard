name: 更新籌碼資料v2

on:
  schedule:
    # 測試用：每 5 分鐘一次，確認排程機制本身能不能正常自動觸發
    # 確認正常後要記得改回正式時間表，不然會一直每 5 分鐘跑一次
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "回補幾個日曆日（留白＝不回補，只做一般更新）"
        required: false
        default: ""
      force:
        description: "強制重算已存在的資料（修正計算邏輯後用這個，會覆蓋舊資料）"
        required: false
        type: boolean
        default: false
      force_fields:
        description: "強制重算時只動哪些欄位，空白代表全部（例：twse_insti tpex_insti）"
        required: false
        default: ""

concurrency:
  group: chip-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝套件
        run: pip install --quiet requests

      - name: 回補歷史（僅手動觸發且有填天數時）
        if: inputs.backfill != ''
        run: |
          python scripts/backfill.py "${{ inputs.backfill }}" \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.force_fields }}

      - name: 抓取最新資料
        run: python scripts/update.py

      - name: 產出 dashboard.json
        run: python scripts/build.py

      - name: 提交變更
        run: |
          git config user.name  "chip-bot"
          git config user.email "chip-bot@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "沒有資料變動，略過提交"
          else
            git commit -m "資料更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi
